  const $=s=>document.querySelector(s), state={filter:"全部",i:+localStorage.thidx||0,learned:new Set(JSON.parse(localStorage.thlearned||"[]"))};
  const cats=["全部",...new Set(cards.map(c=>c[0]))]; const visible=()=>cards.map((c,i)=>({c,i})).filter(x=>state.filter==="全部"||x.c[0]===state.filter);
  function renderChips(){ $("#chips").innerHTML=cats.map(c=>`<button class="chip ${c===state.filter?'on':''}" data-cat="${c}">${c}</button>`).join(""); }
  function render(){const list=visible();if(state.i>=list.length)state.i=0;const {c,i}=list[state.i];[["category",0],["thai",1],["roman",2],["meaning",3],["exampleThai",4],["exampleRoman",5],["exampleZh",6],["breakdown",7]].forEach(([id,n])=>$("#"+id).textContent=c[n]);$("#card").classList.remove("open");$("#count").textContent=`${state.i+1} / ${list.length}`;$("#learned").textContent=`已學會 ${state.learned.size} 張`;$("#bar").style.width=`${state.learned.size/cards.length*100}%`;$("#known").textContent=state.learned.has(i)?"已學會 ✓":"我會了 ✓";localStorage.thidx=state.i;renderChips()}
  function move(n){const l=visible().length;state.i=(state.i+n+l)%l;render()} function speak(text){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="th-TH";u.rate=.78;const v=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith("th"));if(v)u.voice=v;speechSynthesis.speak(u)}
  function toast(t){$("#toast").textContent=t;$("#toast").classList.add("show");setTimeout(()=>$("#toast").classList.remove("show"),1200)}
  $("#chips").onclick=e=>{if(!e.target.dataset.cat)return;state.filter=e.target.dataset.cat;state.i=0;render()};$("#card").onclick=e=>{if(!e.target.closest("button"))$("#card").classList.toggle("open")};$("#wordAudio").onclick=e=>{e.stopPropagation();speak(visible()[state.i].c[1])};$("#sentenceAudio").onclick=e=>{e.stopPropagation();speak(visible()[state.i].c[4])};$("#prev").onclick=()=>move(-1);$("#next").onclick=()=>move(1);$("#again").onclick=()=>{state.learned.delete(visible()[state.i].i);save();move(1)};$("#known").onclick=()=>{state.learned.add(visible()[state.i].i);save();toast("เก่งมาก！學會一張了");move(1)};
  function save(){localStorage.thlearned=JSON.stringify([...state.learned])} function quiz(){const target=cards[Math.floor(Math.random()*cards.length)];let opts=[target,...cards.filter(x=>x!==target).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);$("#quizQ").textContent=target[1];$("#choices").innerHTML=opts.map(o=>`<button class="choice" data-ok="${o===target}">${o[3]}</button>`).join("");$("#quiz").showModal()}$("#quizBtn").onclick=quiz;$("#closeQuiz").onclick=()=>$("#quiz").close();$("#choices").onclick=e=>{if(!e.target.classList.contains("choice"))return;e.target.classList.add(e.target.dataset.ok==="true"?"correct":"wrong");if(e.target.dataset.ok!=="true") [...$("#choices").children].find(x=>x.dataset.ok==="true").classList.add("correct");setTimeout(quiz,900)};
  document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")move(1);if(e.key==="ArrowLeft")move(-1)});let today=new Date().toDateString(),last=localStorage.thlast,streak=+localStorage.thstreak||1;if(last&&last!==today){let d=(new Date(today)-new Date(last))/864e5;streak=d===1?streak+1:1}localStorage.thlast=today;localStorage.thstreak=streak;$("#streak").textContent=streak+" 天 🔥";render();
